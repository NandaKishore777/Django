{% extends 'base.html' %}

{% block title %}Edit Note{% endblock %}

{% block content %}
<h2>Edit Note</h2>
<form method="POST">
    {% csrf_token %}
    <input type="text" name="title" value="{{ note.title }}" required><br><br>
    <textarea name="content" required>{{ note.content }}</textarea><br><br>
    <button type="submit">Update</button>
</form>
<br>
<a href="/">Back to Home</a>
{% endblock %}
